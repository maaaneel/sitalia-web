<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin — Barberia El Rincón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;color:#111;min-height:100vh}

/* ── Login ───────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:40px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-logo{width:48px;height:48px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;color:#fff;font-weight:800;letter-spacing:-.02em}
.login-box h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-box p{color:#71717a;font-size:14px;margin-bottom:28px}
.login-input{width:100%;padding:11px 14px;border:1.5px solid #e4e4e7;border-radius:9px;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;transition:border-color .15s}
.login-input:focus{border-color:#111}
.btn-primary{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#333}
.error-msg{color:#ef4444;font-size:13px;margin-top:10px}

/* ── Header ──────────────────────────────────────────── */
.header{background:#111;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{width:28px;height:28px;background:rgba(255,255,255,.1);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.header-brand h1{font-size:15px;font-weight:600}
.logout-btn{color:rgba(255,255,255,.45);font-size:13px;cursor:pointer;background:none;border:none;padding:0;transition:color .15s}
.logout-btn:hover{color:#fff}

/* ── Tab bar ─────────────────────────────────────────── */
.tab-bar{background:#fff;border-bottom:1px solid #e4e4e7;padding:0 24px;display:flex;align-items:center;gap:0;overflow-x:auto}
.tab{padding:14px 16px;font-size:13px;font-weight:500;color:#71717a;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:#111}
.tab.active{color:#111;border-bottom-color:#111}
.tab-bar-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 0;flex-shrink:0}
.nav-btn{background:#f4f4f5;border:1px solid #e4e4e7;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;color:#374151;transition:background .15s;white-space:nowrap;font-family:inherit}
.nav-btn:hover{background:#e4e4e7}
.nav-btn.today-btn{background:#111;color:#fff;border-color:#111}
.nav-btn.today-btn:hover{background:#333}
.date-input{padding:7px 11px;border:1px solid #e4e4e7;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;cursor:pointer}
.date-input:focus{border-color:#111}

/* ── Main ────────────────────────────────────────────── */
.main{max-width:1000px;margin:0 auto;padding:28px 24px}

/* ── Date heading ────────────────────────────────────── */
.date-heading{font-size:18px;font-weight:700;margin-bottom:22px;letter-spacing:-.02em;color:#111}

/* ── Stats ───────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:18px 20px}
.stat-val{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
.stat-lbl{font-size:12px;color:#71717a;margin-top:5px;font-weight:500}
.stat-sub{font-size:11px;color:#a1a1aa;margin-top:2px;min-height:14px}

/* ── Section label ───────────────────────────────────── */
.section-label{font-size:11px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

/* ── DAY VIEW ────────────────────────────────────────── */
.reserva-card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:opacity .2s}
.reserva-card.done{opacity:.45}
.r-hora{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1;min-width:52px}
.r-hora-end{font-size:11px;color:#a1a1aa;margin-top:2px}
.r-sep{width:3px;height:40px;background:#e4e4e7;border-radius:2px;flex-shrink:0}
.r-sep.active{background:#22c55e}
.r-info{flex:1;min-width:130px}
.r-nombre{font-size:15px;font-weight:600;margin-bottom:3px}
.r-svc{font-size:13px;color:#71717a}
.r-contact{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.r-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge-ok{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.dot-green{width:5px;height:5px;border-radius:50%;background:#22c55e}
.btn-sm{background:#f4f4f5;color:#111;border:1px solid #e4e4e7;font-size:12px;font-weight:500;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;font-family:inherit;transition:background .15s}
.btn-sm:hover{background:#e4e4e7}
.btn-danger{background:#fff;color:#ef4444;border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.empty-state{text-align:center;padding:52px 24px;color:#a1a1aa;font-size:14px;background:#fff;border:1px solid #e4e4e7;border-radius:12px}
.loading-state{text-align:center;padding:40px;color:#a1a1aa;font-size:13px}

/* ── MULTI VIEW ──────────────────────────────────────── */
.multi-grid{display:grid;gap:14px}
.multi-grid.g3{grid-template-columns:repeat(3,1fr)}
.multi-grid.g7{grid-template-columns:repeat(7,1fr)}
@media(max-width:860px){.multi-grid.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.multi-grid.g3,.multi-grid.g7{grid-template-columns:1fr}}
.day-col{background:#fff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden}
.day-col-head{padding:11px 13px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between}
.day-col-head.today-col{background:#111;color:#fff}
.day-col-title{font-size:12px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.06em}
.day-col-head.today-col .day-col-title{color:rgba(255,255,255,.7)}
.day-col-cnt{font-size:11px;font-weight:600;background:#f4f4f5;color:#374151;padding:2px 7px;border-radius:100px}
.day-col-head.today-col .day-col-cnt{background:rgba(255,255,255,.15);color:#fff}
.day-col-body{padding:8px}
.mini-card{padding:8px 10px;border-radius:8px;border-left:3px solid #22c55e;background:#f9fafb;margin-bottom:6px}
.mini-card.past{border-color:#d1d5db;opacity:.55}
.mini-time{font-size:11px;font-weight:700;color:#111;margin-bottom:1px}
.mini-name{font-size:12px;font-weight:500;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-svc{font-size:11px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-empty{text-align:center;padding:14px 8px;color:#d1d5db;font-size:12px}

/* ── EQUIPO TAB ──────────────────────────────────────── */
.equipo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.equipo-title{font-size:16px;font-weight:700}
.btn-add{background:#111;color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-add:hover{background:#333}

/* Worker form card */
.worker-form{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:24px;margin-bottom:16px}
.worker-form h3{font-size:14px;font-weight:700;margin-bottom:18px;color:#374151}
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:#71717a}
.form-input{padding:9px 12px;border:1.5px solid #e4e4e7;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;background:#fff}
.form-input:focus{border-color:#111}
.form-input.w-name{width:220px}

/* Schedule grid */
.sched-grid{border:1px solid #e4e4e7;border-radius:10px;overflow:hidden;margin-bottom:18px}
.sched-row{display:grid;grid-template-columns:120px auto 1fr;align-items:center;padding:10px 14px;gap:12px;border-bottom:1px solid #e4e4e7}
.sched-row:last-child{border-bottom:none}
.sched-row.off{background:#fafafa}
.sched-day-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.day-toggle{width:16px;height:16px;cursor:pointer;accent-color:#111;flex-shrink:0}
.sched-times{display:flex;align-items:center;gap:6px}
.time-input{padding:6px 8px;border:1px solid #e4e4e7;border-radius:7px;font-size:13px;font-family:inherit;outline:none;width:88px}
.time-input:focus{border-color:#111}
.time-sep{font-size:12px;color:#a1a1aa;font-weight:500}
.sched-off-label{font-size:12px;color:#a1a1aa;font-style:italic}
.form-actions{display:flex;gap:10px;align-items:center}
.btn-save{background:#111;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#333}
.btn-cancel-form{background:#f4f4f5;color:#111;border:1px solid #e4e4e7;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-cancel-form:hover{background:#e4e4e7}

/* Worker list */
.worker-card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:18px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.worker-avatar{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.worker-info{flex:1;min-width:140px}
.worker-name{font-size:15px;font-weight:600;margin-bottom:4px}
.worker-sched{font-size:12px;color:#71717a;line-height:1.6}
.worker-actions{display:flex;gap:8px}

/* ── Block panel ─────────────────────────────────────── */
.block-panel{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:20px;margin-bottom:20px}
.block-panel-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:14px}
.block-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

/* ── Responsive ──────────────────────────────────────── */
@media(max-width:600px){
  .main{padding:18px 14px}
  .stat-val{font-size:22px}
  .r-hora{font-size:16px;min-width:44px}
  .sched-row{grid-template-columns:100px auto 1fr;padding:8px 10px;gap:8px}
  .form-input.w-name{width:100%}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════════ -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">B</div>
    <h1>Barberia El Rincón</h1>
    <p>Panel de administración</p>
    <input id="pwd-input" class="login-input" type="password" placeholder="Contraseña"
           onkeydown="if(event.key==='Enter')login()">
    <button class="btn-primary" onclick="login()">Entrar</button>
    <p id="login-error" class="error-msg" style="display:none">Contraseña incorrecta</p>
  </div>
</div>

<!-- ══ PANEL ═══════════════════════════════════════════════════════════════ -->
<div id="admin-screen" style="display:none">

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">B</div>
      <h1>Barberia El Rincón</h1>
    </div>
    <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab active" data-view="day"   onclick="setView('day')">Diaria</button>
    <button class="tab"        data-view="3d"    onclick="setView('3d')">3 días</button>
    <button class="tab"        data-view="week"  onclick="setView('week')">Semana</button>
    <button class="tab"        data-view="equipo" onclick="setView('equipo')">Equipo</button>
    <div class="tab-bar-right" id="nav-controls">
      <button class="nav-btn" onclick="navigate(-1)">← Ant.</button>
      <button class="nav-btn today-btn" onclick="irHoy()">Hoy</button>
      <button class="nav-btn" onclick="navigate(1)">Sig. →</button>
      <input id="fecha-input" class="date-input" type="date" onchange="onDateChange()" title="Ir a fecha">
    </div>
  </div>

  <div class="main">

    <!-- Date heading -->
    <div class="date-heading" id="date-heading"></div>

    <!-- Stats (siempre muestran datos de HOY) -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="s-total">—</div>
        <div class="stat-lbl">Citas hoy</div>
        <div class="stat-sub" id="s-total-sub"></div>
      </div>
      <div class="stat">
        <div class="stat-val" id="s-prox">—</div>
        <div class="stat-lbl">Próxima cita</div>
        <div class="stat-sub" id="s-prox-sub"></div>
      </div>
      <div class="stat">
        <div class="stat-val" id="s-ing">—</div>
        <div class="stat-lbl">Ingresos hoy</div>
        <div class="stat-sub" id="s-ing-sub">estimados</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="s-week">—</div>
        <div class="stat-lbl">Esta semana</div>
        <div class="stat-sub" id="s-week-sub">citas</div>
      </div>
    </div>

    <!-- Contenido dinámico por vista -->
    <div id="view-content"></div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   CONSTANTES Y ESTADO
═══════════════════════════════════════════════════ */
var NEGOCIO   = 'peluqueria';
var _token    = '';
var _view     = 'day';
var _baseDate = new Date();

var DAYS_SHORT = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
var DAYS_LONG  = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var MONTHS     = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MONTHS_C   = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

/* ═══════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════ */
function login() {
  var pwd = document.getElementById('pwd-input').value.trim();
  if (!pwd) return;
  fetch('/api/admin-reservas?negocio=' + NEGOCIO + '&fecha=' + isoDate(_baseDate) + '&token=' + enc(pwd))
    .then(function(r) {
      if (r.ok) {
        _token = pwd;
        sessionStorage.setItem('admin_token', pwd);
        document.getElementById('login-screen').style.display  = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        document.getElementById('fecha-input').value = isoDate(_baseDate);
        loadTodayStats();
        render();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    })
    .catch(function() { document.getElementById('login-error').style.display = 'block'; });
}
function logout() {
  sessionStorage.removeItem('admin_token');
  _token = '';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}
(function autoLogin() {
  var saved = sessionStorage.getItem('admin_token');
  if (saved) { document.getElementById('pwd-input').value = saved; login(); }
})();

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function isoDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n) { return n < 10 ? '0'+n : ''+n; }
function enc(s) { return encodeURIComponent(s); }
function fmt(m) {
  var h = Math.floor(m/60), mm = m%60;
  return h + ':' + (mm < 10 ? '0' : '') + mm;
}
function minsToTime(m) { return pad(Math.floor(m/60)) + ':' + pad(m%60); }
function timeToMins(t) { var p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]||0); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
function weekStart(d) {
  var r = new Date(d), dow = r.getDay();
  r.setDate(r.getDate() + (dow === 0 ? -6 : 1 - dow));
  return r;
}
function isToday(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var x = new Date(d); x.setHours(0,0,0,0);
  return x.getTime() === t.getTime();
}
function isPast(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var x = new Date(d); x.setHours(0,0,0,0);
  return x < t;
}
function shortDate(d) {
  return DAYS_SHORT[d.getDay()===0?6:d.getDay()-1] + ' ' + d.getDate() + ' ' + MONTHS_C[d.getMonth()];
}
function longDate(d) {
  var dow = d.getDay()===0?6:d.getDay()-1;
  return DAYS_LONG[dow] + ', ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

/* ═══════════════════════════════════════════════════
   FETCH HELPERS
═══════════════════════════════════════════════════ */
function fetchDay(fecha) {
  return fetch('/api/admin-reservas?negocio='+NEGOCIO+'&fecha='+fecha+'&token='+enc(_token))
    .then(function(r){ return r.json(); })
    .then(function(d){ return d.reservas || []; });
}
function fetchWorkers() {
  return fetch('/api/trabajadores?negocio='+NEGOCIO+'&token='+enc(_token))
    .then(function(r){ return r.json(); })
    .then(function(d){ return d.trabajadores || []; });
}

/* ═══════════════════════════════════════════════════
   STATS (siempre con datos de HOY)
═══════════════════════════════════════════════════ */

// Filtra slots bloqueados por admin (no son citas reales de clientes)
function soloReales(rs) {
  return rs.filter(function(r) {
    return !r.servicio || !r.servicio.startsWith('BLOQUEADO:');
  });
}

function loadTodayStats() {
  var today = isoDate(new Date());
  var mon   = weekStart(new Date());

  // Indicadores de carga
  ['s-total','s-prox','s-ing','s-week'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.textContent === '—') el.textContent = '…';
  });

  // Stats del día de hoy
  fetchDay(today).then(function(all) {
    var rs  = soloReales(all);
    var now = new Date();
    var minN = now.getHours()*60 + now.getMinutes();

    document.getElementById('s-total').textContent     = rs.length;
    document.getElementById('s-total-sub').textContent = rs.length === 1 ? 'cita confirmada' : 'citas confirmadas';

    var prox = rs.find(function(r){ return r.hora_inicio >= minN; });
    document.getElementById('s-prox').textContent     = prox ? fmt(prox.hora_inicio) : '—';
    document.getElementById('s-prox-sub').textContent = prox ? prox.nombre : (rs.length ? 'no quedan más hoy' : 'libre');

    var ing = rs.reduce(function(s,r){ return s + (parseFloat(r.precio)||0); }, 0);
    document.getElementById('s-ing').textContent     = ing > 0 ? Math.round(ing) + '€' : (rs.length ? '0€' : '—');
    document.getElementById('s-ing-sub').textContent = 'ingresos estimados';
  }).catch(function() {
    document.getElementById('s-total').textContent = '?';
  });

  // Stats semanales (lunes → domingo de la semana actual)
  var promises = [];
  for (var i = 0; i < 7; i++) promises.push(fetchDay(isoDate(addDays(mon, i))));
  Promise.all(promises).then(function(days) {
    var allRs = days.map(soloReales);
    var total = allRs.reduce(function(s,d){ return s + d.length; }, 0);
    var ing   = allRs.reduce(function(s,d){
      return s + d.reduce(function(ss,r){ return ss + (parseFloat(r.precio)||0); }, 0);
    }, 0);
    document.getElementById('s-week').textContent     = total;
    document.getElementById('s-week-sub').textContent = total + ' citas' + (ing > 0 ? ' · ' + Math.round(ing) + '€' : '');
  }).catch(function() {
    document.getElementById('s-week').textContent = '?';
  });
}

/* ═══════════════════════════════════════════════════
   NAVEGACIÓN Y VISTAS
═══════════════════════════════════════════════════ */
function setView(v) {
  _view = v;
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.view === v);
  });
  // Ocultar nav de fechas en vista equipo
  document.getElementById('nav-controls').style.display = v === 'equipo' ? 'none' : '';
  render();
}
function navigate(dir) {
  var step = _view === 'week' ? 7 : _view === '3d' ? 3 : 1;
  _baseDate = addDays(_baseDate, dir * step);
  document.getElementById('fecha-input').value = isoDate(_baseDate);
  render();
}
function irHoy() {
  _baseDate = new Date();
  document.getElementById('fecha-input').value = isoDate(_baseDate);
  render();
}
function onDateChange() {
  var v = document.getElementById('fecha-input').value;
  if (v) { _baseDate = new Date(v + 'T12:00:00'); render(); }
}
function render() {
  if      (_view === 'day')    renderDay();
  else if (_view === '3d')     renderMulti(3);
  else if (_view === 'week')   renderMulti(7);
  else if (_view === 'equipo') renderEquipo();
}

/* ═══════════════════════════════════════════════════
   VISTA DIARIA
═══════════════════════════════════════════════════ */
function renderDay() {
  var fecha = isoDate(_baseDate);
  document.getElementById('date-heading').textContent = longDate(_baseDate);
  document.getElementById('view-content').innerHTML =
    '<div class="block-panel">' +
      '<div class="block-panel-title">Bloquear franja horaria</div>' +
      '<div class="block-form">' +
        '<div class="form-group"><label class="form-label">Fecha</label><input type="date" id="bl-fecha" class="form-input" value="'+fecha+'"></div>' +
        '<div class="form-group"><label class="form-label">Hora inicio</label><input type="time" id="bl-ini" class="form-input" value="09:00"></div>' +
        '<div class="form-group"><label class="form-label">Hora fin</label><input type="time" id="bl-fin" class="form-input" value="10:00"></div>' +
        '<div class="form-group"><label class="form-label">Motivo (opcional)</label><input type="text" id="bl-motivo" class="form-input" style="width:180px" placeholder="Reunión, festivo…"></div>' +
        '<div class="form-group"><label class="form-label">&nbsp;</label><button class="btn-save" onclick="bloquearFranja()">Bloquear</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="section-label">Citas del día</div>' +
    '<div id="day-list"><div class="loading-state">Cargando…</div></div>';

  fetchDay(fecha).then(function(rs) {
    renderDayList(rs, fecha, 'day-list');
  }).catch(function() {
    document.getElementById('day-list').innerHTML = '<div class="empty-state">Error al cargar</div>';
  });
}

function renderDayList(rs, fecha, elId) {
  var el = document.getElementById(elId);
  if (!el) return;

  // Separar citas reales de franjas bloqueadas
  var reales     = rs.filter(function(r){ return !r.servicio || !r.servicio.startsWith('BLOQUEADO:'); });
  var bloqueados = rs.filter(function(r){ return r.servicio && r.servicio.startsWith('BLOQUEADO:'); });

  if (rs.length === 0) {
    el.innerHTML = '<div class="empty-state">No hay citas para este día</div>';
    return;
  }

  var now   = new Date();
  var minN  = now.getHours()*60 + now.getMinutes();
  var today = isToday(new Date(fecha + 'T12:00:00'));

  var html = '';

  // Citas reales
  if (reales.length === 0) {
    html += '<div class="empty-state" style="margin-bottom:12px">Sin citas de clientes</div>';
  } else {
    html += reales.map(function(r) {
      var horaFin = r.hora_fin || (r.hora_inicio + r.duracion_min);
      var done    = today && horaFin <= minN;
      var active  = today && r.hora_inicio <= minN && horaFin > minN;
      return '<div class="reserva-card' + (done ? ' done' : '') + '" id="card-'+r.id+'">' +
        '<div><div class="r-hora">'+fmt(r.hora_inicio)+'</div><div class="r-hora-end">'+fmt(horaFin)+'</div></div>' +
        '<div class="r-sep'+(active?' active':'')+'"></div>' +
        '<div class="r-info">' +
          '<div class="r-nombre">'+r.nombre+'</div>' +
          '<div class="r-svc">'+r.servicio+' &middot; '+r.duracion_min+' min'+(r.precio?' &middot; '+r.precio+'€':'')+'</div>' +
          '<div class="r-contact">' +
            (r.telefono?'<a href="tel:'+r.telefono+'" class="btn-sm">'+r.telefono+'</a>':'')+
            '<a href="mailto:'+r.email+'" class="btn-sm">'+r.email+'</a>' +
          '</div>' +
        '</div>' +
        '<div class="r-actions">' +
          '<span class="badge-ok"><span class="dot-green"></span>Confirmada</span>' +
          (r.telefono?'<a href="https://wa.me/'+r.telefono.replace(/\D/g,'')+'?text='+enc('Hola '+r.nombre+', te escribimos desde Barberia El Rincón.')+'" target="_blank" class="btn-sm">WhatsApp</a>':'')+
          '<button class="btn-sm btn-danger" onclick="cancelar('+r.id+')">Cancelar</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Franjas bloqueadas (separadas visualmente)
  if (bloqueados.length > 0) {
    html += '<div class="section-label" style="margin-top:20px">Franjas bloqueadas</div>';
    html += bloqueados.map(function(r) {
      var horaFin = r.hora_fin || (r.hora_inicio + r.duracion_min);
      var motivo  = r.servicio.replace('BLOQUEADO: ', '');
      return '<div class="reserva-card done" id="card-'+r.id+'" style="background:#fafafa;border-style:dashed">' +
        '<div><div class="r-hora" style="font-size:15px;color:#71717a">'+fmt(r.hora_inicio)+'</div><div class="r-hora-end">'+fmt(horaFin)+'</div></div>' +
        '<div class="r-sep"></div>' +
        '<div class="r-info">' +
          '<div class="r-nombre" style="color:#71717a;font-size:13px">Franja bloqueada</div>' +
          '<div class="r-svc">'+motivo+'</div>' +
        '</div>' +
        '<div class="r-actions">' +
          '<button class="btn-sm btn-danger" onclick="cancelar('+r.id+')" title="Eliminar bloqueo">Desbloquear</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  el.innerHTML = html;
}

/* ═══════════════════════════════════════════════════
   VISTA MULTI (3 días / semana)
═══════════════════════════════════════════════════ */
function renderMulti(nDays) {
  var start = nDays === 7 ? weekStart(_baseDate) : _baseDate;
  var dates = [];
  for (var i = 0; i < nDays; i++) dates.push(addDays(start, i));

  var f = dates[0], l = dates[dates.length-1];
  document.getElementById('date-heading').textContent =
    f.getDate()+' '+MONTHS_C[f.getMonth()]+' — '+l.getDate()+' '+MONTHS_C[l.getMonth()]+' '+l.getFullYear();

  var cls = nDays === 7 ? 'g7' : 'g3';
  var html = '<div class="multi-grid ' + cls + '">';
  dates.forEach(function(d) {
    var key = isoDate(d);
    var head = isToday(d) ? 'today-col' : '';
    html += '<div class="day-col">'+
      '<div class="day-col-head '+head+'">'+
        '<span class="day-col-title">'+shortDate(d)+'</span>'+
        '<span class="day-col-cnt" id="cnt-'+key+'">…</span>'+
      '</div>'+
      '<div class="day-col-body" id="body-'+key+'"><div class="loading-state" style="padding:16px 8px;font-size:12px">…</div></div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('view-content').innerHTML = html;

  dates.forEach(function(d) {
    var key = isoDate(d);
    fetchDay(key).then(function(all) {
      var rs  = soloReales(all);
      var blq = all.length - rs.length; // cantidad de bloqueados
      // El contador solo muestra citas reales
      document.getElementById('cnt-'+key).textContent = rs.length;
      var body = document.getElementById('body-'+key);
      if (!body) return;
      if (rs.length === 0 && blq === 0) {
        body.innerHTML = '<div class="mini-empty">Sin citas</div>';
        return;
      }
      var now  = new Date();
      var minN = now.getHours()*60 + now.getMinutes();
      var tod  = isToday(d);
      var html = rs.map(function(r) {
        var horaFin = r.hora_fin || (r.hora_inicio + r.duracion_min);
        var done = tod && horaFin <= minN;
        return '<div class="mini-card'+(done?' past':'')+'" title="'+r.nombre+' · '+r.servicio+'">'+
          '<div class="mini-time">'+fmt(r.hora_inicio)+'</div>'+
          '<div class="mini-name">'+r.nombre+'</div>'+
          '<div class="mini-svc">'+r.servicio+'</div>'+
        '</div>';
      }).join('');
      // Indicador de franjas bloqueadas si las hay
      if (blq > 0) {
        html += '<div class="mini-empty" style="color:#d1d5db;font-size:11px;padding:6px 8px">'+blq+' franja'+(blq>1?'s':'')+' bloqueada'+(blq>1?'s':'')+'</div>';
      }
      body.innerHTML = html || '<div class="mini-empty">Sin citas</div>';
    }).catch(function() {
      var c = document.getElementById('cnt-'+key);
      var b = document.getElementById('body-'+key);
      if (c) c.textContent = '!';
      if (b) b.innerHTML = '<div class="mini-empty">Error</div>';
    });
  });
}

/* ═══════════════════════════════════════════════════
   CANCELAR RESERVA
═══════════════════════════════════════════════════ */
function cancelar(id) {
  if (!confirm('¿Cancelar esta reserva? Se enviará un email de aviso al cliente.')) return;
  fetch('/api/admin-reservas?id='+id+'&token='+enc(_token), { method: 'DELETE' })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) {
        var c = document.getElementById('card-'+id);
        if (c) { c.style.opacity='.2'; c.style.pointerEvents='none'; }
        setTimeout(function(){ loadTodayStats(); render(); }, 600);
      } else {
        alert('Error: ' + (d.error || ''));
      }
    });
}

/* ═══════════════════════════════════════════════════
   BLOQUEAR FRANJA
═══════════════════════════════════════════════════ */
function bloquearFranja() {
  var fecha  = document.getElementById('bl-fecha').value;
  var ini    = document.getElementById('bl-ini').value;
  var fin    = document.getElementById('bl-fin').value;
  var motivo = (document.getElementById('bl-motivo').value || '').trim() || 'Bloqueado';
  if (!fecha || !ini || !fin) { alert('Completa fecha y horas.'); return; }
  var iniM = timeToMins(ini), finM = timeToMins(fin);
  if (finM <= iniM) { alert('La hora de fin debe ser posterior a la de inicio.'); return; }
  fetch('/api/booking', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      negocio: NEGOCIO,
      servicio: 'BLOQUEADO: '+motivo,
      duracion_min: finM - iniM,
      precio: 0,
      fecha: fecha,
      hora_inicio: iniM,
      hora_fin: finM,
      nombre: 'Admin',
      email: 'admin@sitalia.es'
    })
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (d.ok) {
      document.getElementById('bl-motivo').value = '';
      loadTodayStats();
      render();
    } else {
      alert('Error: ' + (d.error || 'No se pudo bloquear'));
    }
  }).catch(function(){ alert('Error de conexión'); });
}

/* ═══════════════════════════════════════════════════
   PESTAÑA EQUIPO
═══════════════════════════════════════════════════ */
var _editingId = null;

function renderEquipo() {
  document.getElementById('date-heading').textContent = 'Gestión del equipo';
  document.getElementById('view-content').innerHTML =
    '<div class="equipo-header">' +
      '<div class="equipo-title">Trabajadores</div>' +
      '<button class="btn-add" onclick="showWorkerForm(null)">+ Añadir trabajador</button>' +
    '</div>' +
    '<div id="worker-form-wrap" style="display:none"></div>' +
    '<div id="workers-list"><div class="loading-state">Cargando…</div></div>';

  loadWorkers();
}

function loadWorkers() {
  fetchWorkers().then(function(ws) {
    var el = document.getElementById('workers-list');
    if (!el) return;
    if (ws.length === 0) {
      el.innerHTML = '<div class="empty-state">No hay trabajadores. Añade el primero para gestionar la disponibilidad de citas.</div>';
      return;
    }
    el.innerHTML = ws.map(function(w) {
      return '<div class="worker-card" id="wcard-'+w.id+'">' +
        '<div class="worker-avatar">'+initials(w.nombre)+'</div>' +
        '<div class="worker-info">' +
          '<div class="worker-name">'+w.nombre+'</div>' +
          '<div class="worker-sched">'+schedSummary(w.horario)+'</div>' +
        '</div>' +
        '<div class="worker-actions">' +
          '<button class="btn-sm" onclick="showWorkerForm('+JSON.stringify(w).replace(/"/g,'&quot;')+')">Editar</button>' +
          '<button class="btn-sm btn-danger" onclick="deleteWorker('+w.id+',\''+w.nombre+'\')">Eliminar</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }).catch(function() {
    var el = document.getElementById('workers-list');
    if (el) el.innerHTML = '<div class="empty-state">Error al cargar los trabajadores</div>';
  });
}

function initials(name) {
  return name.split(' ').slice(0,2).map(function(p){ return p[0]; }).join('').toUpperCase();
}

function schedSummary(horario) {
  if (!horario || horario.length === 0) return 'Sin horario configurado';
  var working = (horario || []).filter(function(d){ return d.inicio !== null; });
  if (working.length === 0) return 'Sin días laborables';
  var lines = working.map(function(d){
    return DAYS_SHORT[d.dow] + ' ' + minsToTime(d.inicio) + '-' + minsToTime(d.fin);
  });
  return lines.join(' &middot; ');
}

function showWorkerForm(worker) {
  _editingId = worker ? worker.id : null;
  var wrap = document.getElementById('worker-form-wrap');
  if (!wrap) return;

  // Horario por defecto: Lun-Vie 9:00-18:00
  var defaultSched = [
    {dow:0, inicio:540, fin:1080},
    {dow:1, inicio:540, fin:1080},
    {dow:2, inicio:540, fin:1080},
    {dow:3, inicio:540, fin:1080},
    {dow:4, inicio:540, fin:1080},
    {dow:5, inicio:null, fin:null},
    {dow:6, inicio:null, fin:null}
  ];
  var sched = worker ? (worker.horario && worker.horario.length ? worker.horario : defaultSched) : defaultSched;

  var rows = '';
  for (var i = 0; i < 7; i++) {
    var dayData = sched.find(function(d){ return d.dow === i; }) || {dow:i, inicio:null, fin:null};
    var works   = dayData.inicio !== null;
    var iniVal  = works ? minsToTime(dayData.inicio) : '09:00';
    var finVal  = works ? minsToTime(dayData.fin)    : '18:00';
    rows += '<div class="sched-row' + (works ? '' : ' off') + '" id="srow-'+i+'">' +
      '<label class="sched-day-label">' +
        '<input type="checkbox" class="day-toggle" id="dcheck-'+i+'" '+(works?'checked':'')+' onchange="toggleDayRow('+i+')">' +
        DAYS_LONG[i] +
      '</label>' +
      '<div class="sched-times" id="stimes-'+i+'" style="'+(works?'':'display:none')+'">' +
        '<input type="time" class="time-input" id="dini-'+i+'" value="'+iniVal+'">' +
        '<span class="time-sep">—</span>' +
        '<input type="time" class="time-input" id="dfin-'+i+'" value="'+finVal+'">' +
      '</div>' +
      '<span class="sched-off-label" id="soff-'+i+'" style="'+(works?'display:none':'')+'"">Libre</span>' +
    '</div>';
  }

  wrap.innerHTML =
    '<div class="worker-form">' +
      '<h3>' + (worker ? 'Editar trabajador' : 'Nuevo trabajador') + '</h3>' +
      '<div class="form-row">' +
        '<div class="form-group">' +
          '<label class="form-label">Nombre</label>' +
          '<input type="text" id="w-nombre" class="form-input w-name" placeholder="Nombre completo" value="'+(worker?worker.nombre:'')+'">' +
        '</div>' +
      '</div>' +
      '<div class="form-label" style="margin-bottom:10px">Horario laboral</div>' +
      '<div class="sched-grid">' + rows + '</div>' +
      '<div class="form-actions">' +
        '<button class="btn-save" onclick="saveWorker()">Guardar</button>' +
        '<button class="btn-cancel-form" onclick="hideWorkerForm()">Cancelar</button>' +
      '</div>' +
    '</div>';

  wrap.style.display = 'block';
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleDayRow(i) {
  var checked = document.getElementById('dcheck-'+i).checked;
  var row     = document.getElementById('srow-'+i);
  var times   = document.getElementById('stimes-'+i);
  var off     = document.getElementById('soff-'+i);
  if (checked) {
    row.classList.remove('off');
    times.style.display = '';
    off.style.display   = 'none';
  } else {
    row.classList.add('off');
    times.style.display = 'none';
    off.style.display   = '';
  }
}

function hideWorkerForm() {
  var wrap = document.getElementById('worker-form-wrap');
  if (wrap) wrap.style.display = 'none';
  _editingId = null;
}

function saveWorker() {
  var nombre = (document.getElementById('w-nombre').value || '').trim();
  if (!nombre) { alert('El nombre es obligatorio.'); return; }

  var horario = [];
  for (var i = 0; i < 7; i++) {
    var works = document.getElementById('dcheck-'+i).checked;
    horario.push({
      dow:   i,
      inicio: works ? timeToMins(document.getElementById('dini-'+i).value) : null,
      fin:    works ? timeToMins(document.getElementById('dfin-'+i).value) : null
    });
  }

  var body = { negocio: NEGOCIO, nombre: nombre, horario: horario, token: _token };
  if (_editingId) body.id = _editingId;

  fetch('/api/trabajadores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    // Leer como texto primero para detectar respuestas HTML (función no desplegada)
    return r.text().then(function(txt) {
      try {
        var d = JSON.parse(txt);
        if (d.ok) {
          hideWorkerForm();
          loadWorkers();
        } else {
          alert('Error del servidor: ' + (d.error || 'error desconocido'));
        }
      } catch(e) {
        // El servidor devolvió HTML en vez de JSON — probablemente la función no está desplegada
        alert('Error: el servidor devolvió una respuesta inesperada (HTTP ' + r.status + ').\n\nPosibles causas:\n1. api/trabajadores.js no está subido a GitHub\n2. Vercel no ha redesplegado aún\n\nRespuesta del servidor:\n' + txt.slice(0, 200));
      }
    });
  }).catch(function(e){ alert('Error de red: ' + e.message); });
}

function deleteWorker(id, nombre) {
  if (!confirm('¿Eliminar a ' + nombre + ' del equipo?')) return;
  fetch('/api/trabajadores?id='+id+'&token='+enc(_token), { method: 'DELETE' })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) { loadWorkers(); }
      else { alert('Error: ' + (d.error || '')); }
    });
}
</script>
