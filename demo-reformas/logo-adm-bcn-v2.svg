<svg width="180" height="60" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Elemento geométrico: puerta/arco arquitectónico -->
  <path d="M 10 10 L 10 50 M 30 10 L 30 50 M 10 10 C 10 5, 15 5, 20 5 C 25 5, 30 5, 30 10" 
        stroke="#C97B5B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- ADM en mayúsculas serif -->
  <text x="45" y="40" font-family="Georgia, Garamond, serif" font-size="28" font-weight="400" fill="#2A241E" letter-spacing="1">
    EST
  </text>
  
  <!-- Separador vertical sutil -->
  <line x1="102" y1="20" x2="102" y2="45" stroke="#C97B5B" stroke-width="1" opacity="0.4"/>
  
  <!-- BCN más pequeño y espaciado -->
  <text x="110" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#C97B5B" letter-spacing="2.5">
    BCN
  </text>
  
  <!-- REFORMAS debajo de BCN -->
  <text x="110" y="45" font-family="Arial, sans-serif" font-size="8" font-weight="500" fill="#8B6F4E" letter-spacing="2">
    REFORMAS
  </text>
</svg>